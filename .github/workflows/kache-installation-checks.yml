name: Kache installation checks

on:
  pull_request:
    paths:
      - Formula/kache.rb
      - Formula/kache-unstable.rb
      - .github/workflows/update-kache-formula.yml
      - .github/workflows/kache-installation-checks.yml
      - tests/test_kache_companion.py

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: python3 -m unittest discover -s tests -v
